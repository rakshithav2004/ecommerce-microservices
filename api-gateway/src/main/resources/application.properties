server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.gateway.server.webmvc.routes[0].id=product-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/products/**
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/orders/**
spring.cloud.gateway.server.webmvc.routes[2].id=product-service-docs
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/product-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=RewritePath=/product-service/v3/api-docs,/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[3].id=order-service-docs
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/order-service/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=RewritePath=/order-service/v3/api-docs,/v3/api-docs
springdoc.swagger-ui.urls[0].name=Product Service
springdoc.swagger-ui.urls[0].url=/product-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=Order Service
springdoc.swagger-ui.urls[1].url=/order-service/v3/api-docs
jwt.secret=EcommerceMicroservicesSecretKeyForJwtAuthentication2026Secure